[package]
name = "clibm"
version = "0.1.0"
edition = "2021"
authors = ["CLIBM Contributors"]
description = "Lightweight, local-first CLI project management system with BLAKE3 Content-Addressable Storage and Git-style versioning"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "clibm"
path = "src/main.rs"

[lib]
name = "clibm_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
