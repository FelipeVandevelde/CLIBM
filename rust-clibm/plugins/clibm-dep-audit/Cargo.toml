[package]
name = "clibm-dep-audit"
version = "0.1.0"
edition = "2021"
description = "Standalone DAG critical path and circular dependency auditor plugin for CLIBM"
authors = ["CLIBM Systems Engineering"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "clibm-dep-audit"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
