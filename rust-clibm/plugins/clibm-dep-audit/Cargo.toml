[package]
name = "clibm-dep-audit"
version = "0.1.0"
edition = "2021"
description = "Standalone DAG critical path and circular dependency auditor plugin for CLIBM"
authors = ["CLIBM Systems Engineering"]
license = "MIT"

[[bin]]
name = "clibm-dep-audit"
path = "src/main.rs"

[dependencies]
# The CLIBM core library (project state, models and the plugin SDK).
clibm_core = { package = "clibm", path = "../.." }
serde_json = "1.0"
anyhow = "1.0"
