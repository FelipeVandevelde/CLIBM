[package]
name = "clibm-mcp"
version = "0.2.0"
edition = "2021"
description = "Self-hosted Model Context Protocol (MCP) server plugin for AI agents with modular STDIO and HTTP transports"
authors = ["CLIBM Systems Engineering"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "clibm-mcp"
path = "src/main.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tiny_http = { version = "0.12", optional = true }

[features]
default = ["transport-stdio", "transport-http"]
transport-stdio = []
transport-http = ["dep:tiny_http"]
