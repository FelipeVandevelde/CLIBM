[package]
name = "clibm-tui"
version = "0.1.0"
edition = "2021"
authors = ["CLIBM Contributors"]
description = "Standalone Ratatui & Crossterm Terminal User Interface (TUI) plugin for ongoing CLIBM projects"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "clibm-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
