[package]
name = "clibm-tui"
version = "0.1.0"
edition = "2021"
authors = ["CLIBM Contributors"]
description = "Standalone Ratatui & Crossterm Terminal User Interface (TUI) plugin for ongoing CLIBM projects"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "clibm-tui"
path = "src/main.rs"

[dependencies]
# The CLIBM core library: all reads and writes go through it.
clibm_core = { package = "clibm", path = "../.." }
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1.0"
