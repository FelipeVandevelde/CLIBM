[package]
name = "clibm-plugin-template"
version = "0.1.0"
edition = "2021"
description = "Official starter template for building standalone CLIBM plugins in Rust"
authors = ["CLIBM Systems Engineering"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "clibm-plugin-template"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
