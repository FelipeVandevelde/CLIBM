[package]
name = "clibm-docs"
version = "0.1.0"
edition = "2021"
description = "Standalone AI Documentation & Context Teacher plugin generating AGENTS.md, CLAUDE.md, and .cursorrules for CLIBM projects"
authors = ["CLIBM Systems Engineering"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "clibm-docs"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
