[package]
name = "clibm-export-md"
version = "0.1.0"
edition = "2021"
description = "Standalone Markdown sprint report exporter plugin for CLIBM"
authors = ["CLIBM Systems Engineering"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "clibm-export-md"
path = "src/main.rs"

[dependencies]
# The CLIBM core library (project state, models and the plugin SDK).
clibm_core = { package = "clibm", path = "../.." }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
