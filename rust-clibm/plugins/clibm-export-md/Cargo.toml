[package]
name = "clibm-export-md"
version = "0.1.0"
edition = "2021"
description = "Standalone Markdown sprint report exporter plugin for CLIBM"
authors = ["CLIBM Systems Engineering"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "clibm-export-md"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
