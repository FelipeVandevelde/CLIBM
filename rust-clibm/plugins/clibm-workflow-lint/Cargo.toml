[package]
name = "clibm-workflow-lint"
version = "0.1.0"
edition = "2021"
description = "Standalone Kanban WIP limit and workflow policy linter plugin for CLIBM"
authors = ["CLIBM Systems Engineering"]
license = "MIT"

[[bin]]
name = "clibm-workflow-lint"
path = "src/main.rs"

[dependencies]
# The CLIBM core library (project state, models and the plugin SDK).
clibm_core = { package = "clibm", path = "../.." }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
