[package]
name = "clibm-web"
version = "0.1.0"
edition = "2021"
authors = ["CLIBM Contributors"]
description = "Standalone single-binary local HTTP server plugin serving an embedded Web UI for ongoing CLIBM projects"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "clibm-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
